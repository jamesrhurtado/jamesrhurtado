name: Refresh weekly Clippy motivation

on:
  schedule:
    # Monday at 08:00 in Lima (UTC-5).
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      motivation_index:
        description: Optional zero-based motivation index for a manual refresh
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-clippy-motivation
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-banner.txt

      - name: Install banner dependencies
        run: python -m pip install --requirement requirements-banner.txt

      - name: Render this week's motivation
        env:
          MANUAL_INDEX: ${{ inputs.motivation_index }}
        run: |
          if [[ -n "$MANUAL_INDEX" ]]; then
            motivation_index="$MANUAL_INDEX"
          else
            motivation_count="$(python -c 'from scripts.render_profile_banner import MOTIVATIONS; print(len(MOTIVATIONS))')"
            week_number="$(( $(date -u +%s) / 604800 ))"
            motivation_index="$(( week_number % motivation_count ))"
          fi

          echo "Rendering motivation index ${motivation_index}"
          python scripts/render_profile_banner.py \
            --motivation-index "$motivation_index"

      - name: Commit the refreshed GIF
        run: |
          if git diff --quiet -- assets/profile-assistant-banner.gif; then
            echo "The selected motivation is already rendered."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-assistant-banner.gif
          git commit -m "chore: refresh weekly Clippy motivation"
          git push
